name: Build GinkgoX Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential \
            curl git zip unzip \
            libssl-dev libelf-dev \
            python3

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Clone GCC 64
        run: |
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 gcc64

      - name: Clone GCC 32
        run: |
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm gcc32

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          export PATH=$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc32/bin:$PATH

          export CC=clang
          export CROSS_COMPILE=aarch64-elf-
          export CROSS_COMPILE_ARM32=arm-eabi-

          make O=out vendor/ginkgo-perf_defconfig

          make -j$(nproc) \
            O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-elf- \
            CROSS_COMPILE_ARM32=arm-eabi-

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GinkgoX-Kernel
          path: out/arch/arm64/boot/*